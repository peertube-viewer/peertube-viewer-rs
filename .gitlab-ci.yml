variables:
  RUST_BACKTRACE: "1"

stages:
  - test
  - build
  - deploy

rust-latest:
  stage: test
  cache:
    key: latest
    paths:
      - target/
  image: rust:latest
  script:
    - rustup component add rustfmt
    - rustup component add clippy
    - cargo build --verbose --locked
    - cargo test --verbose --workspace
    - cargo fmt --all --verbose -- --check
    - cargo clippy --workspace --verbose -- -D clippy::all
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - src/**/*
        - crates/**/*
        - Cargo.toml
        - Cargo.lock
        - build.rs
        - .gitlab-ci.yml

rust-minimal:
  stage: test
  cache:
    key: latest
    paths:
      - target/
  image: rust:1.85
  script:
    - rustup component add rustfmt
    - rustup component add clippy
    - cargo build --verbose --locked
    - cargo test --verbose --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - src/**/*
        - crates/**/*
        - Cargo.toml
        - Cargo.lock
        - build.rs
        - .gitlab-ci.yml

rust-nightly:
  allow_failure: true
  stage: test
  image: rustlang/rust:nightly
  script:
    - cargo build --verbose --locked
    - rustup component add clippy
    - cargo test --verbose
    - cargo clippy --workspace --verbose -- -D clippy::all
  cache:
    key: nightly
    paths:
      - target/
  rules:
    - if: $CI_RUN_NIGHTLY_COMPILER == "True"

release-linux:
  stage: build
  image: rust:latest
  script:
    - cargo build --release --locked --verbose
    - ./scripts/create-realease-tarbal.sh
  cache:
    key: release-linux
    paths:
      - target/
  artifacts:
    paths:
      - linux-build/
  only:
    - tags

cargo-audit:
  stage: test
  image: alpine:latest
  script:
    - apk add cargo-audit
    - cargo-audit audit --deny warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
